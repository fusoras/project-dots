[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #AEEEEE
secondary = #E0FFFF
alert = #A54242
disabled = #707880
purple    = #b48ead

[bar/bar1]
width = 100%
height = 20pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0

padding-left = 0
padding-right = 0

module-margin = 2

separator = |
separator-foreground = ${colors.disabled}

; font-0 = monospace;2
font-0 = "JetBrainsMono Nerd Font:size=9;2"

modules-center = date
modules-left = xworkspaces xwindow
modules-right = pulseaudio memory cpu wlan eth xkeyboard systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.secondary}
label-active-foreground = ${colors.background}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %{F#e0ffff}%title:0:50:...%%{F-}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 10

format-charging    = "  <label>"
format-discharging = "<ramp-capacity> <label>"
format-full        = "  full"

label = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

format-charging-foreground = ${colors.yellow}
format-discharging-foreground = ${colors.green}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = "  <label-volume>"
format-muted  = "  muted"

label-volume = %percentage%%
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format = "  <label>"
format-foreground = ${colors.purple}
label = %percentage_used%%
;label = %gb_used% (%percentage_used%%)

[module/cpu]
type = internal/cpu
interval = 2
format = "  <label>"
label = %percentage:2%%
format-foreground = ${colors.seconday}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#74f0d5}%ifname%%{F#707880} disconnected

;[module/wlan]
;inherit = network-base
;interface-type = wireless
;label-connected = %{F#74f0d5}%ifname%%{F-} %essid% %local_ip%

[module/date]
type = internal/date
interval = 1

date = %b %d  %H:%M
label = "  %date%"
label-foreground = ${colors.primary}

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
