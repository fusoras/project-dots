name: Release project-dots Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: project-dots-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            asset_name: project-dots-aarch64-linux-android.tar.gz
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tool for cross-compilation
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binary into tarball
        run: |
          tar -czf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release project-dots

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
