name: Release project-dots Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: project-dots-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-linux-android
            asset_name: project-dots-aarch64-linux-android.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary into tarball
        run: |
          tar -czf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release project-dots

      - name: Upload asset to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
