[categories.lazyvim-minimal]
aliases = ["lzv-min"]
description = "Minimal LazyVim dependencies and editor setup"
group = "Editors & IDEs"
debian_packages = ["git", "curl", "clang", "fd-find", "lazygit"]
termux_packages = ["neovim", "git", "curl", "clang", "fd", "lazygit"]

[categories.lazyvim-minimal.custom.debian]
name = "neovim"
type = "github_release_tarball"
url = "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz"
extract_dir = "/opt/nvim"
bin_symlink = "~/.local/bin/nvim"

[[categories.lazyvim-minimal.post_install_commands]]
description = "Clone default config for LazyVim to ~/.config/nvim (creates backups if existing config found)"
prompt = "Do you want to clone default config for LazyVim to ~/.config/nvim?"
confirm = true
command = "if [ ! -d \"$HOME/.config/nvim/.git\" ]; then [ -d \"$HOME/.config/nvim\" ] && mv \"$HOME/.config/nvim\" \"$HOME/.config/nvim.bak.$(date +%Y%m%d%H%M%S)\"; [ -d \"$HOME/.local/share/nvim\" ] && mv \"$HOME/.local/share/nvim\" \"$HOME/.local/share/nvim.bak.$(date +%Y%m%d%H%M%S)\"; [ -d \"$HOME/.local/state/nvim\" ] && mv \"$HOME/.local/state/nvim\" \"$HOME/.local/state/nvim.bak.$(date +%Y%m%d%H%M%S)\"; [ -d \"$HOME/.cache/nvim\" ] && mv \"$HOME/.cache/nvim\" \"$HOME/.cache/nvim.bak.$(date +%Y%m%d%H%M%S)\"; git clone https://github.com/LazyVim/starter \"$HOME/.config/nvim\" && rm -rf \"$HOME/.config/nvim/.git\"; fi"


[categories.zsh-tokyonight]
aliases = ["zsh-tn"]
description = "Zsh terminal setup with TokyoNight Starship prompt, JetBrains Mono font, eza, zoxide, bat, git, atuin, and fzf"
group = "Shell & Terminal"
debian_packages = ["zsh", "git", "eza", "zoxide", "bat", "starship", "atuin", "fzf"]
termux_packages = ["zsh", "git", "eza", "zoxide", "bat", "starship", "atuin", "fzf"]
final_message = "Restart your terminal or run: exec zsh"
termux_final_message = "Restart Termux or run: exec zsh"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Change default user shell to Zsh"
command = "chsh -s $(which zsh)"
platform = "debian"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Change default user shell to Zsh"
command = "chsh -s zsh"
platform = "termux"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Export ZDOTDIR, XDG_STATE_HOME, STARSHIP_CONFIG, and ZPLUGINSDIR env vars in ~/.zshenv"
command = "grep -qF 'export ZDOTDIR=\"$HOME/.config/zsh\"' \"$HOME/.zshenv\" 2>/dev/null || printf '%s\\n' 'export ZDOTDIR=\"$HOME/.config/zsh\"' 'export XDG_STATE_HOME=\"$HOME/.local/state\"' 'export STARSHIP_CONFIG=\"$ZDOTDIR/starship.toml\"' 'export ZPLUGINSDIR=\"$ZDOTDIR/plugins\"' >> \"$HOME/.zshenv\""

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# History configuration"
position = "top"
line = """
HISTFILE="$XDG_STATE_HOME/zsh/history"
HISTSIZE=100000
SAVEHIST=100000
setopt SHARE_HISTORY
setopt HIST_IGNORE_DUPS
setopt HIST_IGNORE_SPACE
setopt HIST_EXPIRE_DUPS_FIRST"""
description = "Configure Zsh persistent history options at top of ~/.config/zsh/.zshrc under section '# History configuration'"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Source Zsh custom aliases ($ZDOTDIR/aliases.zsh) in ~/.config/zsh/.zshrc"
command = "grep -qF 'source \"$ZDOTDIR/aliases.zsh\"' \"$HOME/.config/zsh/.zshrc\" 2>/dev/null || echo 'source \"$ZDOTDIR/aliases.zsh\"' >> \"$HOME/.config/zsh/.zshrc\""

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# Fast init tools"
line = 'eval "$(starship init zsh)"'
description = "Initialize Starship prompt in ~/.config/zsh/.zshrc under section '# Fast init tools'"

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# Fast init tools"
line = 'eval "$(zoxide init zsh)"'
description = "Initialize zoxide in ~/.config/zsh/.zshrc under section '# Fast init tools'"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Download zsh-autosuggestions plugin repository"
command = "git clone --depth=1 https://github.com/zsh-users/zsh-autosuggestions ~/.config/zsh/plugins/zsh-autosuggestions 2>/dev/null || true; rm -rf ~/.config/zsh/plugins/zsh-autosuggestions/.git"

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# Zsh plugins"
line = 'source ~/.config/zsh/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh'
description = "Enable zsh-autosuggestions plugin in ~/.config/zsh/.zshrc under section '# Zsh plugins'"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Download fast-syntax-highlighting plugin repository"
command = "git clone --depth=1 https://github.com/zdharma-continuum/fast-syntax-highlighting ~/.config/zsh/plugins/fast-syntax-highlighting 2>/dev/null || true; rm -rf ~/.config/zsh/plugins/fast-syntax-highlighting/.git"

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# Zsh plugins"
line = 'source ~/.config/zsh/plugins/fast-syntax-highlighting/fast-syntax-highlighting.plugin.zsh'
description = "Enable fast-syntax-highlighting plugin in ~/.config/zsh/.zshrc under section '# Zsh plugins'"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Download fzf-tab plugin repository"
command = "git clone --depth=1 https://github.com/Aloxaf/fzf-tab ~/.config/zsh/plugins/fzf-tab 2>/dev/null || true; rm -rf ~/.config/zsh/plugins/fzf-tab/.git"

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# Zsh plugins"
line = 'source ~/.config/zsh/plugins/fzf-tab/fzf-tab.plugin.zsh'
description = "Enable fzf-tab plugin in ~/.config/zsh/.zshrc under section '# Zsh plugins'"

[[categories.zsh-tokyonight.post_install_commands]]
description = "Enable Zsh completion system (compinit) in ~/.config/zsh/.zshrc"
command = "grep -qF 'autoload -Uz compinit' \"$HOME/.config/zsh/.zshrc\" 2>/dev/null || echo 'autoload -Uz compinit' >> \"$HOME/.config/zsh/.zshrc\""

[[categories.zsh-tokyonight.post_install_commands]]
description = "Set Zsh completion format styling in ~/.config/zsh/.zshrc"
command = "grep -qF \"zstyle ':completion:*' format\" \"$HOME/.config/zsh/.zshrc\" 2>/dev/null || printf '%s\\n' \"zstyle ':completion:*' format '\\u001b[2;37mCompleting %d\\u001b[m'\" >> \"$HOME/.config/zsh/.zshrc\""

[[categories.zsh-tokyonight.section_injections]]
file = "~/.config/zsh/.zshrc"
section = "# Fast init tools"
line = 'eval "$(atuin init zsh)"'
description = "Initialize Atuin shell history in ~/.config/zsh/.zshrc under section '# Fast init tools'"

[[categories.zsh-tokyonight.copy_files]]
src = "config/zsh-tokyonight/starship.toml"
dest = "~/.config/zsh/starship.toml"

[[categories.zsh-tokyonight.copy_files]]
src = "config/zsh-tokyonight/aliases.zsh"
dest = "~/.config/zsh/aliases.zsh"

[[categories.zsh-tokyonight.copy_files]]
src = "config/zsh-tokyonight/font.ttf"
dest = "~/.termux/font.ttf"
platform = "termux"
only_if_not_exists = true


