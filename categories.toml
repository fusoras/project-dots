[categories.agent-tools]
aliases = ["ai-tools"]
description = "Token-saving agentic helper tools suite for Debian (engram, herdr, codegraph)"
group = "AI & Agents"
debian_packages = ["curl", "git", "tar", "grep"]

[[categories.agent-tools.post_install_commands]]
description = "Install or update engram (latest release)"
prompt = "Do you want to download and install/update engram to ~/.local/bin/engram?"
confirm = true
platform = "debian"
command = "LATEST_TAG=$(curl -fsSL https://api.github.com/repos/Gentleman-Programming/engram/releases/latest | grep '\"tag_name\":' | sed -E 's/.*\"tag_name\": *\"([^\"]+)\".*/\\1/'); VER=${LATEST_TAG#v}; mkdir -p ~/.local/bin && curl -fsSL \"https://github.com/Gentleman-Programming/engram/releases/download/${LATEST_TAG}/engram_${VER}_linux_amd64.tar.gz\" | tar -xz -C ~/.local/bin engram && chmod +x ~/.local/bin/engram"

[[categories.agent-tools.post_install_commands]]
description = "Install or update herdr"
prompt = "Do you want to install/update herdr (via https://herdr.dev/install.sh)?"
confirm = true
platform = "debian"
command = "curl -fsSL https://herdr.dev/install.sh | sh"

[[categories.agent-tools.post_install_commands]]
description = "Install or update codegraph"
prompt = "Do you want to install/update codegraph (via install.sh)?"
confirm = true
platform = "debian"
command = "curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | sh"


